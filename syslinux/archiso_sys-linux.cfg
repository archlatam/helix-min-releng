LABEL helix
TEXT HELP
Boot the Helix Linux install medium on BIOS.
It allows you to install Helix Linux or perform system maintenance.
ENDTEXT
MENU LABEL Helix Linux install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL helixspeech
TEXT HELP
Boot the Helix Linux install medium on BIOS with speakup screen reader.
It allows you to install Helix Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Helix Linux install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

LABEL helixnouveau
TEXT HELP
Boot the Helix Linux install medium with the open-source nouveau driver (KMS forced).
ENDTEXT
MENU LABEL Helix Linux - ^NVIDIA (nouveau)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nouveau.modeset=1

LABEL helixsafe
TEXT HELP
Boot with safe graphics (nomodeset). The live Wayland session (niri) will not start;
you will get a basic framebuffer/console, useful to diagnose black screens.
ENDTEXT
MENU LABEL Helix Linux - safe graphics (^nomodeset)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset vga=791
