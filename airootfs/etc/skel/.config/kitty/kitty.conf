# Helix Linux — kitty
# Paleta Catppuccin Mocha, coherente con niri / GTK / Qt.

# --- Fuente JetBrainsMono Nerd Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Colores base ---
foreground       #cdd6f4
background       #24273a  # color del cuadrado del logo (Catppuccin Macchiato base)

# --- Cursor (mauve de Catppuccin) ---
cursor             #cba6f7
cursor_text_color  #24273a
cursor_shape       beam
cursor_blink_interval 0.5

# --- Selección (surface1 / text) ---
selection_background #45475a
selection_foreground #cdd6f4

# --- Paleta Catppuccin Mocha ---
color0  #313244  # black
color1  #f38ba8  # red
color2  #a6e3a1  # green
color3  #f9e2af  # yellow
color4  #89b4fa  # blue
color5  #cba6f7  # magenta
color6  #94e2d5  # cyan
color7  #cdd6f4  # white

color8  #585b70  # bright black
color9  #f38ba8  # bright red
color10 #a6e3a1  # bright green
color11 #f9e2af  # bright yellow
color12 #89b4fa  # bright blue
color13 #cba6f7  # bright magenta
color14 #94e2d5  # bright cyan
color15 #cdd6f4  # bright white

# --- Barra de pestañas (acorde con niri) ---
tab_bar_style         powerline
tab_bar_background    #11111b
active_tab_background #cba6f7
active_tab_foreground #11111b
inactive_tab_background #313244
inactive_tab_foreground #cdd6f4

# --- Ventana ---
window_padding_width 10
#background_opacity   0.95

# --- Varios ---
enable_audio_bell no
mouse_hide_wait 3.0
